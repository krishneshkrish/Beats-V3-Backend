name: Render Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render from sleeping (Render sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Endpoint
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            URL="https://beats-v3-backend.onrender.com"
          fi
          echo "Pinging ${URL}/health (allowing 90s for cold-boot)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 5 "${URL}/health" || echo "000")
          echo "Health check status: ${STATUS}"

          echo "Pinging ${URL}/api/trending..."
          TREND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${URL}/api/trending" || echo "000")
          echo "Trending status: ${TREND_STATUS}"

